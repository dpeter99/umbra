      - uses: xu-cheng/texlive-action/full@v1
        with:
          run: |
            apk add cmake ninja powershell graphviz
            apk add git openjdk11-jre fontconfig ttf-dejavu font-droid font-droid-nonlatin freetype tree
            export LD_LIBRARY_PATH=/usr/lib

            git config --global --add safe.directory /github/workspace
            chmod -R 777 ./

            cd ./projs/docs/publications/thesis

            mkdir build
            tree -dfi --noreport ./ | xargs -I{} mkdir -p "./build/{}"
            cmake -G Ninja -B build
            cmake --build build -t thesis

      - name: Upload PDF file
        uses: actions/upload-artifact@v3
        with:
          name: PDF
          path: ./projs/docs/publications/thesis/build/main.pdf

