name: Deploy Archivist site to Pages

on:
    # Runs on pushes targeting the default branch
    push:

    # Allows you to run this workflow manually from the Actions tab
    workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
    contents: read
    pages: write
    id-token: write

    # Allow one concurrent deployment
concurrency:
    group: "pages"
    cancel-in-progress: true

env:
    BUILD_PATH: "projs/docs/doc-site/" # default value when not using subfolders
    # BUILD_PATH: subfolder

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        steps:
          - name: Checkout
            uses: actions/checkout@v3
          - name: Setup Node
            uses: actions/setup-node@v3
            with:
                node-version: "16"
                cache: ${{ steps.detect-package-manager.outputs.manager }}
                cache-dependency-path: ${{ env.BUILD_PATH }}/package-lock.json
          - name: Install doxygen
            run: sudo apt-get install -y doxygen
          - name: Setup Pages
            id: pages
            uses: actions/configure-pages@v2
          - name: Run Doxygen
            run: doxygen ./Doxyfile
            working-directory: ${{ env.BUILD_PATH }}

          - name: Build Template
            run: npm ci && npm run build
            working-directory: ${{ env.BUILD_PATH }}/template
            env:
              ARCHIVIST_URL: ${{ steps.pages.outputs.base_url }}


          - uses: denoland/setup-deno@v1
            with:
              deno-version: v1.x
          - name: Build Docs
            run: npm run build
            working-directory: ${{ env.BUILD_PATH }}
            env:
              ARCHIVIST_URL: ${{ steps.pages.outputs.base_url }}

          - name: Upload artifact
            uses: actions/upload-pages-artifact@v1
            with:
                path: ${{ env.BUILD_PATH }}/out

    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        needs: build
        runs-on: ubuntu-latest
        name: Deploy
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v1