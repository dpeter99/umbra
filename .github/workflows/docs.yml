name: Deploy Archivist site to Pages

on:
    # Runs on pushes targeting the default branch
    push:

    # Allows you to run this workflow manually from the Actions tab
    workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
    contents: read
    pages: write
    id-token: write

    # Allow one concurrent deployment
concurrency:
    group: "pages"
    cancel-in-progress: true

env:
    BUILD_PATH: "projs/website/" # default value when not using subfolders
    # BUILD_PATH: subfolder

jobs:
    # JOB to run change detection
    changes:
      runs-on: ubuntu-latest
      # Required permissions
      permissions:
        pull-requests: read
      # Set job outputs to values from filter step
      outputs:
        backend: ${{ steps.filter.outputs.docs }}
        frontend: ${{ steps.filter.outputs.proj_shadow }}
      steps:
      # For pull requests it's not necessary to checkout the code
      - name: Checkout
        uses: actions/checkout@v3
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            docs:
              - 'backend/**'
            proj_shadow:
              - 'projs/shadow/**'
    build:
        name: Build
        runs-on: ubuntu-latest
        steps:
          - name: Checkout
            uses: actions/checkout@v3
          - name: Setup Node
            uses: actions/setup-node@v3
            with:
                node-version: "16"
                cache: ${{ steps.detect-package-manager.outputs.manager }}
                cache-dependency-path: ${{ env.BUILD_PATH }}/package-lock.json

          - name: Cache doxygen
            id: cache-doxygen
            uses: actions/cache@v3
            env:
              cache-name: cache-node-modules
            with:
              # npm cache files are stored in `~/.npm` on Linux/macOS
              path: ${{ env.BUILD_PATH }}/doxygen-out
              key: proj-shadow-doxygen-${{ hashFiles('projs/shadow/**') }}

          - name: Install doxygen
            if: ${{ steps.cache-doxygen.outputs.cache-hit != 'true' }}
            run: sudo apt-get install -y doxygen

          - name: Run Doxygen
            if: ${{ steps.cache-doxygen.outputs.cache-hit != 'true' }}
            run: doxygen ./Doxyfile
            working-directory: ${{ env.BUILD_PATH }}

          - name: Setup Pages
            id: pages
            uses: actions/configure-pages@v2

          - name: Build Template
            run: npm ci && npm run build
            working-directory: ${{ env.BUILD_PATH }}/_template
            env:
              ARCHIVIST_URL: ${{ steps.pages.outputs.base_url }}

          - uses: denoland/setup-deno@v1
            with:
              deno-version: v1.x

          - name: Build Docs
            run: deno run -A --unstable ${{ env.BUILD_PATH }}/archivist.config.ts
            working-directory: ${{ env.BUILD_PATH }}
            env:
              ARCHIVIST_URL: ${{ steps.pages.outputs.base_url }}

          - name: Upload artifact
            uses: actions/upload-pages-artifact@v1
            with:
                path: ${{ env.BUILD_PATH }}/out

    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        needs: build
        runs-on: ubuntu-latest
        name: Deploy
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v1